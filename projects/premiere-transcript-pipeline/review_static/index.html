<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>話者と区間の修正</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div class="header-media">
      <video id="video" controls preload="metadata" hidden></video>
      <audio id="audio" controls preload="metadata" hidden></audio>
    </div>
    <div class="header-copy">
      <p class="eyebrow">TRANSCRIPT REVIEW</p>
      <h1 id="project-title">話者と区間の修正</h1>
      <p id="source-media"></p><p id="summary">読み込み中…</p>
      <div class="header-actions-row"><div class="header-buttons">
        <button id="undo-segment-edit" disabled>元に戻す</button>
        <button id="redo-segment-edit" disabled>やり直す</button>
        <button id="export" disabled>Premiere用に保存</button>
      </div></div>
      <section class="toolbar">
        <label>話者 <select id="speaker-filter"><option value="">すべての話者</option></select></label>
        <label>検索 <input id="search" type="search" placeholder="本文・話者"></label>
        <span id="visible-count"></span>
      </section>
      <p class="review-note">話者・区間の変更は自動保存されます。本文と単語時刻は保持します。Premiereへの直接反映は準備中です。</p>
    </div>
  </header>
  <main>
    <p id="notice" role="status" aria-live="polite"></p>
    <section id="items" class="items"></section>
  </main>
  <template id="item-template">
    <article class="card">
      <div class="meta">
        <button class="play">▶ 試聴</button>
        <label class="speaker-control">話者 <select class="speaker-select" aria-label="この区間の話者"></select></label>
        <span class="time"></span>
      </div>
      <div class="proposal"><h2>文字起こし</h2>
        <textarea readonly aria-label="文字起こし本文・分割位置の選択"></textarea>
      </div>
      <div class="actions">
        <label>分割位置 <select class="split-boundary" aria-label="分割する単語境界"><option value="">境界を選択</option></select></label>
        <button class="split-segment" disabled>カーソル位置で分割</button>
        <button class="merge-next">次の区間と結合</button>
        <span class="saved">分割する単語の境界にカーソルを置いてください</span>
      </div>
    </article>
  </template>
  <script src="/app.js"></script>
</body>
</html>
