[project]
name = "premiere-speaker-repair"
version = "0.1.0"
description = "Audio-assisted review of Premiere Pro speaker labels"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.3",
  "speechbrain>=1.0",
  "huggingface-hub>=0.24",
  "imageio-ffmpeg>=0.5",
  "mlx-whisper>=0.4.2",
  "python-docx>=1.1",
  "pypdf>=5.0",
  "rapidfuzz>=3.9",
  "pykakasi>=2.3,<3",
]

[project.scripts]
speaker-repair = "speaker_repair.cli:main"

[tool.setuptools.packages.find]
include = ["speaker_repair*"]

[tool.setuptools.package-data]
speaker_repair = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
